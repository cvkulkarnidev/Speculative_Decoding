assistant_model_path: /home/c.kulkarni/hf_models/google/gemma-4-E2B-it-assistant
target_model_path: /home/c.kulkarni/hf_models/google/gemma-4-E2B-it
assistant_adapter_path:

train_data_dir: data/tokenized/gemma4/train
eval_data_dir: data/tokenized/gemma4/eval
test_data_dir: data/tokenized/gemma4/test
output_dir: outputs/gemma4_assistant_finetuned
tensorboard_log_dir: outputs/gemma4_assistant_finetuned/tensorboard

max_length: 2048
learning_rate: 0.00002
weight_decay: 0.0
max_grad_norm: 1.0
warmup_steps: 100
gradient_accumulation_steps: 4
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
num_train_epochs: 1
max_steps: -1
logging_steps: 10
eval_steps: 200
save_steps: 500
seed: 42

# Distillation makes the assistant match the frozen target model, which is the
# objective needed for speculative decoding. It requires full target logits.
temperature: 1.0
kl_weight: 1.0
ce_weight: 0.0

# Official EAGLE-3 uses seven recurrent positions weighted by 0.8**step.
# Start with 1 for Gemma assistants, then increase after validating VRAM/runtime.
rollout_steps: 1
rollout_decay: 0.8

bf16: true
fp16: false
gradient_checkpointing: true
trust_remote_code: true

use_lora: true
merge_lora_on_save: true
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
